# CastleDefinder game settings

# --- Tower defense theme -------------------------------------------------
# No day/night cycle: the battle rages under a permanent sky.
time_speed = 0
# TNT is used by players to clear the battlefield.
enable_tnt = true

# --- Give players their starting kit -------------------------------------
# The M4 and the sniper rifle are handed out automatically by the guns4d mod.
# Here we only add the ready-made steel shovel (plus a few survival basics).
give_initial_stuff = true
initial_stuff = default:shovel_steel,default:pick_steel,default:axe_steel,default:torch 32,default:cobble 99

# --- Mobs ----------------------------------------------------------------
# Waves are handled by the castle_defense mod; allow fireballs to destroy
# the brick walls.
mobs_griefing = true

# --- Arena ---------------------------------------------------------------
# The castle_defense mod sculpts the whole arena itself on top of the empty
# singlenode mapgen.
mg_name = singlenode
# Spawn in the keep, just behind the inner wall.
static_spawnpoint = 0,1,-8
